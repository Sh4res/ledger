on:
  push:
    branches:
      - release/v1.12
  pull_request:
    types: [ assigned, opened, synchronize, reopened ]
  release:
    types: [ prereleased, released ]

name: Main
jobs:
  Test_postgres:
    name: 'Test with PostgreSQL'
    runs-on: ubuntu-latest
    steps:
      - name: Install task
        uses: arduino/setup-task@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@v3
      - uses: actions/setup-go@v3
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Run tests
        run: task tests
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          fail_ci_if_error: false # optional (default = false)
          verbose: true # optional (default = false)

  # Test_sqlite:
  #   uses: formancehq/gh-workflows/.github/workflows/golang-test.yml@main

  Control:
    name: 'Control'
    uses: ./.github/workflows/template_build-control.yaml
    secrets:
      NUMARY_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  DockerRelease:
    needs:
      - Control
      - Test_sqlite
      - Test_postgres
    if: github.event_name == 'release'
    uses: ./.github/workflows/template_docker.yaml
    with:
      VERSION: ${{ github.event.release.tag_name }}
      APP_SHA: ${{ github.sha }}
      RELEASE: ${{ github.event.action }}
    secrets:
      SEGMENT_WRITE_KEY_OSS: ${{ secrets.SEGMENT_WRITE_KEY_OSS }}

  DockerBranch:
    needs:
      - Control
      - Test_sqlite
      - Test_postgres
    if: github.event_name != 'release'
    uses: ./.github/workflows/template_docker.yaml
    with:
      VERSION: develop
      APP_SHA: ${{ github.sha }}
      RELEASE: ${{ github.event.action }}
    secrets:
      SEGMENT_WRITE_KEY_OSS: ${{ secrets.SEGMENT_WRITE_KEY_OSS }}
